<!doctype html>
<html lang="ja">
  <head>
<meta charset="utf-8" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="NovaMartのログインページ。" />
    <title>ログイン | NovaMart</title>
    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/style.css?v=20261109" />
    <script defer src="js/data.js"></script>
    <script defer src="js/backend.js"></script>
    <script defer src="js/app.js?v=20261109"></script>
    <script defer src="js/auth.js"></script>
  </head>
  <body id="top">
    <div data-site-header></div>
    <main class="page-main">
      <div class="container">
        <section class="auth-shell">
          <div class="auth-form-panel">
            <p class="eyebrow">WELCOME BACK</p>
            <h1>ログイン</h1>
            <p class="muted">アカウント情報を入力してください。</p>
            <form class="stack-form" id="loginForm" novalidate>
              <label class="form-group"
                >メールアドレス<input
                  name="email"
                  type="email"
                  autocomplete="email"
                  required /><span class="field-error"></span></label
              ><label class="form-group"
                >パスワード
                <div class="password-wrap">
                  <input
                    id="loginPassword"
                    name="password"
                    type="password"
                    
                    autocomplete="current-password"
                    required
                  /><button type="button" data-toggle-password="loginPassword">
                    表示
                  </button>
                </div>
                <span class="field-error"></span
              ></label>
              <div class="auth-links">
                <span>NovaMartアカウントでログイン</span><a href="guide.html#faq">パスワードを忘れた方</a>
              </div>
              <button class="button button-primary full" type="submit">
                ログイン
              </button>
            </form>
            
            <p style="text-align: center; margin-top: 22px">
              初めてご利用の方は
              <a href="register.html" style="color: #176a99; font-weight: 800"
                >新規会員登録</a
              >
            </p>
          </div>
          <div class="auth-visual">
            <p class="eyebrow">NOVA MEMBERS</p>
            <h2>買い物を、<br />もっとスムーズに。</h2>
            <p>
              注文履歴、お気に入り、配送状況をひとつのアカウントで管理できます。
            </p>
          </div>
        </section>
      </div>
    </main>
    <div data-site-footer></div>
  </body>
</html>
