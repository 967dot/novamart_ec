<!doctype html>
<html lang="ja">
  <head>
<meta charset="utf-8" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="NovaMartの商品詳細ページ。商品情報、レビュー、関連商品を掲載しています。"
    />
    <title>商品詳細 | NovaMart</title>
    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/style.css?v=20261109" />
    <script defer src="js/data.js"></script>
    <script defer src="js/backend.js"></script>
    <script defer src="js/app.js?v=20261109"></script>
    <script defer src="js/product.js?v=20261109"></script>
  </head>
  <body id="top">
    <div data-site-header></div>
    <main class="page-main">
      <div class="container breadcrumbs" id="breadcrumbs"></div>
      <section class="page-section-tight">
        <div class="container product-detail-layout" id="productDetail"></div>
      </section>
      <section class="page-section">
        <div class="container description-panel" id="descriptionPanel"></div>
      </section>
      <section class="page-section" style="background: #e8eef2">
        <div class="container">
          <div class="section-heading">
            <div>
              <h2>この商品に関連するアイテム</h2>
              <p>同じカテゴリからおすすめを紹介します。</p>
            </div>
          </div>
          <div class="product-grid" id="relatedProducts"></div>
        </div>
      </section>
      <section class="page-section">
        <div class="container">
          <div class="section-heading">
            <div>
              <h2>カスタマーレビュー</h2>
              <p>商品を購入したお客様の声。</p>
            </div>
          </div>
          <div class="review-layout">
            <form class="review-form stack-form" id="reviewForm">
              <h2>レビューを投稿</h2>
              <p>投稿にはログインが必要です。表示名はアカウント名を使用します。</p><label class="form-group"
                >評価<select name="rating" required>
                  <option value="5">★★★★★ 5</option>
                  <option value="4">★★★★☆ 4</option>
                  <option value="3">★★★☆☆ 3</option>
                  <option value="2">★★☆☆☆ 2</option>
                  <option value="1">★☆☆☆☆ 1</option>
                </select></label
              ><label class="form-group"
                >タイトル<input name="title" required maxlength="60" /></label
              ><label class="form-group"
                >レビュー<textarea
                  name="body"
                  required
                  maxlength="500"
                ></textarea></label
              ><button class="button button-primary" type="submit">
                投稿する
              </button>
            </form>
            <div class="review-list" id="reviewList"></div>
          </div>
        </div>
      </section>
    </main>
    <div data-site-footer></div>
  </body>
</html>
